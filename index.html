<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Social Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-bold text-center mb-2 text-indigo-400">Universal Downloader</h1>
        <p class="text-slate-400 text-center mb-6 text-sm">Download HD Videos from YouTube, TikTok, Instagram & 18+ Platforms</p>

        <div class="space-y-4">
            <input 
                type="url" 
                id="videoUrl" 
                placeholder="Paste video link here (YouTube, TikTok, 18+ site)..." 
                class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500"
            />
            
            <button 
                onclick="processVideo()" 
                id="btnSubmit"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg transition-all duration-200"
            >
                Extract Video
            </button>
        </div>

        <div id="statusMessage" class="mt-4 text-center text-sm text-indigo-300 hidden">Processing stream link...</div>

        <div id="resultBox" class="mt-6 hidden border-t border-slate-700 pt-6 text-center">
            <p class="text-green-400 font-medium mb-3">✓ Extraction Successful!</p>
            <a 
                id="downloadBtn" 
                href="#" 
                target="_blank" 
                class="inline-block bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-lg font-medium transition-all"
            >
                Download File Now
            </a>
        </div>
    </div>

    <script>
        async function processVideo() {
            const url = document.getElementById('videoUrl').value;
            const statusMsg = document.getElementById('statusMessage');
            const resultBox = document.getElementById('resultBox');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!url) {
                alert('Please enter a valid URL');
                return;
            }

            statusMsg.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                const response = await fetch('http://localhost:5000/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (data.success && data.downloadUrl) {
                    downloadBtn.href = data.downloadUrl;
                    resultBox.classList.remove('hidden');
                } else {
                    alert(data.error || 'Failed to extract video links.');
                }
            } catch (err) {
                alert('Connection error. Make sure your server.js backend is running!');
            } finally {
                statusMsg.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
